<svg viewBox="0 0 260 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo long : Ankès avec check dans le K -->
  
  <!-- A -->
  <text x="0" y="78" font-family="Arial Black, Arial, sans-serif" font-size="76" font-weight="900" fill="#2563eb">A</text>
  
  <!-- n -->
  <text x="50" y="78" font-family="Arial Black, Arial, sans-serif" font-size="76" font-weight="900" fill="#2563eb">n</text>
  
  <!-- K : barre verticale + check à droite -->
  <g transform="translate(105, 10)">
    <!-- Barre verticale du K -->
    <rect x="0" y="0" width="14" height="68" rx="2" fill="#2563eb"/>
    <!-- Check vertical qui remplace les 2 branches -->
    <path d="M18,45 L32,62 L54,8 L54,22 L32,76 L18,58 Z" fill="#10b981"/>
  </g>
  
  <!-- è -->
  <text x="160" y="78" font-family="Arial Black, Arial, sans-serif" font-size="76" font-weight="900" fill="#2563eb">è</text>
  
  <!-- s -->
  <text x="205" y="78" font-family="Arial Black, Arial, sans-serif" font-size="76" font-weight="900" fill="#2563eb">s</text>
</svg>
